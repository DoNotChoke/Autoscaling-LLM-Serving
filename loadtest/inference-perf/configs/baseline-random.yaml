# Đường cong QPS → TTFT/TPOT/goodput qua gateway, cùng phân bố độ dài với bench.sh MODE=capacity.
# __API_KEY__, __REPORT_DIR__ do Job thay lúc chạy; không ghi key vào file này.
api:
  type: completion
  streaming: true
  headers:
    x-slo-ttft-ms: "2000"
    x-slo-tpot-ms: "100"
server:
  type: vllm
  model_name: llama31-8b
  base_url: http://llm-gateway-envoy.envoy-gateway-system.svc
  api_key: __API_KEY__
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: /models
data:
  type: random
  # 512 ± 30% token vào, 256 ± 30% token ra; total_count ≥ tổng số request các stage (1.890)
  input_distribution: { min: 358, max: 666, mean: 512, std_dev: 100, total_count: 2000 }
  output_distribution: { min: 179, max: 333, mean: 256, std_dev: 50, total_count: 2000 }
load:
  type: poisson
  base_seed: 1000
  stages:
    - { rate: 0.5, duration: 180 }
    - { rate: 1.0, duration: 180 }
    - { rate: 1.5, duration: 180 }
    - { rate: 2.0, duration: 180 }
    - { rate: 2.5, duration: 180 }
    - { rate: 3.0, duration: 180 }
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
    percentiles: [50, 90, 95, 99]
storage:
  local_storage:
    path: __REPORT_DIR__
