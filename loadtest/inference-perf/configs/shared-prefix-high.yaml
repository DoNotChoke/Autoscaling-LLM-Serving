# 10 nhóm dùng chung system prompt 2048 token: tổng vượt KV 1 replica nhưng vừa 2, route theo prefix có lợi.
# __API_KEY__, __REPORT_DIR__ do Job thay lúc chạy; không ghi key vào file này.
api:
  type: completion
  streaming: true
  headers:
    x-slo-ttft-ms: "2000"
    x-slo-tpot-ms: "100"
server:
  type: vllm
  model_name: llama31-8b
  base_url: http://llm-gateway-envoy.envoy-gateway-system.svc
  api_key: __API_KEY__
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: /models
data:
  type: shared_prefix
  shared_prefix:
    num_groups: 10
    num_prompts_per_group: 100
    system_prompt_len: 2048
    question_len: 256
    output_len: 256
load:
  type: poisson
  base_seed: 1000
  stages:
    - { rate: 0.25, duration: 180 }
    - { rate: 0.5, duration: 180 }
    - { rate: 1, duration: 180 }
    - { rate: 1.5, duration: 180 }
    - { rate: 2, duration: 180 }
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
    percentiles: [50, 90, 95, 99]
storage:
  local_storage:
    path: __REPORT_DIR__
