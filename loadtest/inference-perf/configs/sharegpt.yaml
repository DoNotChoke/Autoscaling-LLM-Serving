# Traffic gần thật: câu hỏi ShareGPT (~105 token vào / ~285 ra), model tự dừng.
# Job chuyển loadtest/datasets/sharegpt-500.jsonl sang ShareGPT JSON (to_sharegpt.py) trước khi chạy.
# __API_KEY__, __REPORT_DIR__ do Job thay lúc chạy; không ghi key vào file này.
api:
  type: completion
  streaming: true
  headers:
    x-slo-ttft-ms: "2000"
    x-slo-tpot-ms: "100"
server:
  type: vllm
  model_name: llama31-8b
  base_url: http://llm-gateway-envoy.envoy-gateway-system.svc
  api_key: __API_KEY__
  ignore_eos: false
tokenizer:
  pretrained_model_name_or_path: /models
data:
  type: shareGPT
  path: /tmp/sharegpt.json
load:
  type: poisson
  base_seed: 1000
  stages:
    - { rate: 0.5, duration: 180 }
    - { rate: 1, duration: 180 }
    - { rate: 2, duration: 180 }
    - { rate: 3, duration: 180 }
    - { rate: 4, duration: 180 }
    - { rate: 5, duration: 180 }
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
    percentiles: [50, 90, 95, 99]
storage:
  local_storage:
    path: __REPORT_DIR__
