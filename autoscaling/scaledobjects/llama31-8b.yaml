# Autoscale predictor theo số request vLLM đang xử lý. InferenceService cần annotation
# autoscalerClass: external để KServe không tạo HPA riêng. Giải thích chi tiết ở docs/adr/0002-autoscaling.md
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llama31-8b
  labels:
    model: llama31-8b
    app.kubernetes.io/part-of: llm-serving
spec:
  scaleTargetRef:
    name: llama31-8b-predictor
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 15
  # Không lấy được metric thì chạy đủ 2 replica cho an toàn
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
        # Load lại model mất vài phút nên chờ 10 phút hết tải mới bớt pod
        scaleDown:
          stabilizationWindowSeconds: 600
          policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
  triggers:
    # running + waiting, tính trung bình mỗi replica
    - type: prometheus
      name: concurrency
      metricType: AverageValue
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        query: sum(llm_serving:vllm_concurrency:sum{namespace="llm-serving", model_name="llama31-8b"}) or vector(0)
        # Tạm theo SLO TTFT p95 1s: 1 replica giữ được ~2 request (loadtest/results/2026-10-24-baseline-1-replica)
        threshold: "2"
    # Ít request nhưng prompt dài vẫn có thể làm đầy KV cache
    - type: prometheus
      name: kvcache
      metricType: Value
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        query: avg(vllm:kv_cache_usage_perc{job="monitoring/vllm", namespace="llm-serving", model_name="llama31-8b"}) or vector(0)
        threshold: "0.8"
