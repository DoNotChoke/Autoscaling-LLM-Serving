apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: llm-route
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: llm-gateway }
  rules:
    # Đường lui / A/B: thêm header x-route-legacy: 1 thì đi đường cũ (Service ClusterIP, chia theo kết nối TCP).
    # Gateway API ưu tiên rule có nhiều header match hơn, nên rule này thắng rule mặc định khi có header
    - matches:
        - headers:
            - { type: Exact, name: x-ai-eg-model, value: llama31-8b }
            - { type: Exact, name: x-route-legacy, value: "1" }
      backendRefs:
        - name: llama31-8b
      timeouts:
        request: 300s
    # Mặc định: EPP chọn pod theo từng request (serving/inference-pool). AI Gateway lấy "model" trong body vào x-ai-eg-model
    - matches:
        - headers: [{ type: Exact, name: x-ai-eg-model, value: llama31-8b }]
      backendRefs:
        - { group: inference.networking.k8s.io, kind: InferencePool, name: llama31-8b }
      # Mặc định 60s; request không stream sinh dài cần lâu hơn
      timeouts:
        request: 300s
  # Số token đọc từ "usage" của response, rate-limit.yaml dùng để trừ hạn mức
  llmRequestCosts:
    - { metadataKey: llm_input_token, type: InputToken }
    - { metadataKey: llm_output_token, type: OutputToken }
    - { metadataKey: llm_total_token, type: TotalToken }
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: llama31-8b
spec:
  schema:
    name: OpenAI
  backendRef:
    { group: gateway.envoyproxy.io, kind: Backend, name: llama31-8b }
---
# AIServiceBackend chưa trỏ thẳng được tới Service (ai-gateway#902), nên đi qua Backend FQDN
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: llama31-8b
spec:
  endpoints:
    - fqdn:
        hostname: llama31-8b-predictor.llm-serving.svc.cluster.local
        port: 80
