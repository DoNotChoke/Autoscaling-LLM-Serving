# Gateway đính key nội bộ khi gọi vLLM (vLLM vẫn bật VLLM_API_KEY). Đọc khoá "apiKey" của Secret vllm-api-key.
# Một policy cho cả 2 đường: route cũ (AIServiceBackend) và InferencePool; không được gắn 2 policy vào cùng một target
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: llama31-8b-apikey
spec:
  targetRefs:
    - { group: aigateway.envoyproxy.io, kind: AIServiceBackend, name: llama31-8b }
    - { group: inference.networking.k8s.io, kind: InferencePool, name: llama31-8b }
  type: APIKey
  apiKey:
    secretRef: { name: vllm-api-key }
