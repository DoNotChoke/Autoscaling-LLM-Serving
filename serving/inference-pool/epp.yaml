# Endpoint Picker: Envoy hỏi qua gRPC ext-proc "request này vào pod nào", EPP chấm điểm pod theo metric vLLM.
# Theo examples/inference-pool/base.yaml của Envoy AI Gateway v1.1.0, image EPP v1.0.2 (khớp go.mod của AI Gateway)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llama31-8b-epp
  labels: { app.kubernetes.io/part-of: llm-serving }
---
apiVersion: v1
kind: Service
metadata:
  name: llama31-8b-epp
  labels: { app.kubernetes.io/part-of: llm-serving }
spec:
  selector: { app: llama31-8b-epp }
  ports:
    - { name: grpc, protocol: TCP, port: 9002, targetPort: 9002, appProtocol: http2 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama31-8b-epp-plugins
  labels: { app.kubernetes.io/part-of: llm-serving }
data:
  # Scorer mặc định: ít hàng chờ, KV cache còn trống, khả năng đã giữ prefix
  default-plugins.yaml: |
    apiVersion: inference.networking.x-k8s.io/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
      - pluginRef: kv-cache-utilization-scorer
      - pluginRef: prefix-cache-scorer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama31-8b-epp
  labels: { app: llama31-8b-epp, app.kubernetes.io/part-of: llm-serving }
spec:
  replicas: 1
  selector:
    matchLabels: { app: llama31-8b-epp }
  template:
    metadata:
      labels: { app: llama31-8b-epp, app.kubernetes.io/part-of: llm-serving }
    spec:
      serviceAccountName: llama31-8b-epp
      # Bằng grace period dài nhất của pod trong pool (vLLM 120s) + đệm
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: registry.k8s.io/gateway-api-inference-extension/epp:v1.0.2
          args:
            - --pool-name=llama31-8b
            - --pool-namespace=llm-serving
            - --grpc-port=9002
            - --grpc-health-port=9003
            - --config-file=/config/default-plugins.yaml
            - --zap-encoder=json
            - --v=2
            # Mặc định v1.0.2 là vllm:gpu_cache_usage_perc, vLLM v0.31 đã đổi tên: không đặt thì scorer KV chấm mù
            - --kv-cache-usage-percentage-metric=vllm:kv_cache_usage_perc
          ports:
            - { name: grpc, containerPort: 9002 }
            - { name: grpc-health, containerPort: 9003 }
            - { name: metrics, containerPort: 9090 }
          livenessProbe:
            grpc: { port: 9003, service: inference-extension }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc: { port: 9003, service: inference-extension }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: plugins, mountPath: /config, readOnly: true }
      volumes:
        - name: plugins
          configMap: { name: llama31-8b-epp-plugins }
---
# Đọc pod (lấy endpoint + scrape metric) và InferencePool/InferenceObjective trong namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llama31-8b-epp
rules:
  - apiGroups: [inference.networking.x-k8s.io]
    resources: [inferenceobjectives, inferencepools]
    verbs: [get, watch, list]
  - apiGroups: [inference.networking.k8s.io]
    resources: [inferencepools]
    verbs: [get, watch, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llama31-8b-epp
subjects:
  - { kind: ServiceAccount, name: llama31-8b-epp, namespace: llm-serving }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: llama31-8b-epp }
---
# Cổng metrics 9090 của EPP xác thực bằng TokenReview/SubjectAccessReview
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llama31-8b-epp-auth-reviewer
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llama31-8b-epp-auth-reviewer
subjects:
  - { kind: ServiceAccount, name: llama31-8b-epp, namespace: llm-serving }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: llama31-8b-epp-auth-reviewer }
