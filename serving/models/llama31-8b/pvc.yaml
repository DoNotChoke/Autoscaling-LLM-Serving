apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-llama31-8b
  labels:
    model: llama31-8b
spec:
  # local-path: dữ liệu nằm trên đĩa node, PV gắn với node đó (single-node)
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 60Gi # BF16 ~16 GB, chừa chỗ cho 1 revision mới khi nâng cấp
