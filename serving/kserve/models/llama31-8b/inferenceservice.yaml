apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama31-8b
  labels:
    model: llama31-8b
    app.kubernetes.io/part-of: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: Standard
    # Để KEDA quyết định số replica (autoscaling/scaledobjects/), KServe không tạo HPA riêng
    serving.kserve.io/autoscalerClass: external
spec:
  predictor:
    # Với external, KServe chỉ dùng số này lúc tạo Deployment
    minReplicas: 1
    maxReplicas: 2
    # Không có GPU dư để tạo pod mới trước, nên thay lần lượt từng pod. Recreate sẽ tắt cả 2 cùng lúc
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
    # Lớn hơn preStop (15s) + request dài nhất (~60s với max_tokens 2048)
    terminationGracePeriodSeconds: 120
    labels:
      model: llama31-8b
      app.kubernetes.io/part-of: llm-serving
    model:
      modelFormat: { name: vllm }
      runtime: vllm-openai
      # Model là OCI image trên registry trong cụm (serving/models/package-model.sh), mount bằng Image Volume.
      # KServe luôn tự mount /mnt/models nên dùng /models
      command: [vllm, serve, /models]
      args:
        - --served-model-name=llama31-8b
        - --max-model-len=16384
        - --gpu-memory-utilization=0.80
        # Mặc định 0 = huỷ request đang chạy khi SIGTERM; phải < grace (120) - preStop (15)
        - --shutdown-timeout=90
        # Tool calling (Open WebUI gửi tools + tool_choice "auto"); template đi kèm image vLLM cho Llama 3.1
        - --enable-auto-tool-choice
        - --tool-call-parser=llama3_json
        - --chat-template=/vllm-workspace/examples/tool_chat_template_llama3.1_json.jinja
      env:
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef: { name: vllm-api-key, key: key }
        # Cache compile ra hostPath để pod sau trên cùng node không compile lại; vLLM tự tách thư mục theo hash config
        - { name: VLLM_CACHE_ROOT, value: /vllm-cache }
      # Ghi port bằng số: không có storageUri thì KServe gắn thêm sidecar agent, mà agent không hiểu port "http"
      # Khởi động ~1 phút, tối đa 10 phút (2s × 300); chu kỳ ngắn để pod Ready ngay khi vLLM sẵn sàng
      startupProbe:
        httpGet: { path: /health, port: 8000 }
        periodSeconds: 2
        failureThreshold: 300
      readinessProbe:
        httpGet: { path: /health, port: 8000 }
        periodSeconds: 3
      # Ngưỡng rộng để không giết pod chỉ vì /health chậm khi đang chịu tải nặng
      livenessProbe:
        httpGet: { path: /health, port: 8000 }
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      lifecycle:
        # Chờ endpoint bị gỡ khỏi Service trước khi vLLM nhận SIGTERM
        preStop:
          sleep: { seconds: 15 }
      resources:
        requests: { nvidia.com/gpu: "1", cpu: "4", memory: 4Gi } # RAM thật ~2,8 GiB; weights nằm trên GPU
        limits: { nvidia.com/gpu: "1", memory: 12Gi } # page cache khi load model bị chặn ở đây, kernel tự thu hồi (đã thử: 0 OOM)
      volumeMounts:
        - { name: shm, mountPath: /dev/shm }
        - { name: model, mountPath: /models, subPath: models, readOnly: true }
        - { name: vllm-cache, mountPath: /vllm-cache }
    volumes:
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 2Gi }
      # Kubelet pull một lần mỗi node rồi giữ trong containerd; đổi model = đổi digest
      - name: model
        image:
          reference: 192.168.1.147:30500/models/llama31-8b@sha256:fac62d62a14e941dd6b1c75c2605396feead233faff69796b63fe9afcfd4a3bf
          pullPolicy: IfNotPresent
      # Mỗi node tự sinh cache ở lần khởi động đầu; xoá thư mục này là về cold start không cache
      - name: vllm-cache
        hostPath: { path: /opt/vllm-cache, type: DirectoryOrCreate }
