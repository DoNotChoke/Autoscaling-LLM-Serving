apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama31-8b
  labels:
    model: llama31-8b
    app.kubernetes.io/part-of: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: Standard
    # Số replica do ScaledObject trong autoscaling/scaledobjects/ quyết định. "external": KServe xoá HPA
    # của nó và bỏ qua replicas; "none" vẫn ép replicas = minReplicas nên giành với HPA (ADR 0002)
    serving.kserve.io/autoscalerClass: external
spec:
  predictor:
    # Chỉ là số khởi tạo khi tạo Deployment; giới hạn thật nằm ở ScaledObject
    minReplicas: 1
    maxReplicas: 2
    # Mỗi node 1 GPU, không có GPU thừa để tạo pod mới trước: tắt 1 pod rồi mới tạo pod thay thế,
    # pod còn lại vẫn phục vụ (Recreate tắt cả 2 cùng lúc)
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
    # Lớn hơn preStop (15s) + request dài nhất (~60s với max_tokens 2048)
    terminationGracePeriodSeconds: 120
    labels:
      model: llama31-8b
      app.kubernetes.io/part-of: llm-serving
    model:
      modelFormat: { name: vllm }
      runtime: vllm-openai
      # PVC do serving/models tạo; current -> revision đang dùng (xem serving/models/models.md)
      storageUri: pvc://model-llama31-8b/current
      args:
        - --served-model-name=llama31-8b
        - --max-model-len=16384
        - --gpu-memory-utilization=0.90
        # Mặc định 0 = huỷ request đang chạy khi SIGTERM; phải < grace (120) - preStop (15)
        - --shutdown-timeout=90
        # Tool calling (Open WebUI gửi tools + tool_choice "auto"); template đi kèm image vLLM cho Llama 3.1
        - --enable-auto-tool-choice
        - --tool-call-parser=llama3_json
        - --chat-template=/vllm-workspace/examples/tool_chat_template_llama3.1_json.jinja
      env:
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef: { name: vllm-api-key, key: key }
      # Load weights + compile mất ~2 phút; cho tối đa 10 phút trước khi coi là hỏng
      startupProbe:
        httpGet: { path: /health, port: http }
        periodSeconds: 10
        failureThreshold: 60
      readinessProbe:
        httpGet: { path: /health, port: http }
        periodSeconds: 10
      # Ngưỡng rộng để không giết pod chỉ vì /health chậm khi đang chịu tải nặng
      livenessProbe:
        httpGet: { path: /health, port: http }
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 5
      lifecycle:
        # Chờ endpoint bị gỡ khỏi Service trước khi vLLM nhận SIGTERM
        preStop:
          sleep: { seconds: 15 }
      resources:
        requests: { nvidia.com/gpu: "1", cpu: "4", memory: 4Gi } # RAM thật ~2,8 GiB; weights nằm trên GPU
        limits: { nvidia.com/gpu: "1", memory: 12Gi } # page cache khi load model bị chặn ở đây, kernel tự thu hồi (đã thử: 0 OOM)
      volumeMounts:
        - { name: shm, mountPath: /dev/shm }
    volumes:
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 2Gi }
