# Quick tunnel thứ hai, riêng cho giao diện web. Chỉ apply SAU KHI đã tạo tài khoản admin
# (người đăng ký đầu tiên trên Open WebUI thành admin). URL đổi mỗi khi pod restart:
#   kubectl -n open-webui logs deploy/cloudflared | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: open-webui
  labels: { app: cloudflared }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.2
          args:
            - tunnel
            - --no-autoupdate
            - --metrics=0.0.0.0:2000
            - --url=http://open-webui.open-webui.svc.cluster.local:80
          ports:
            - { name: metrics, containerPort: 2000 }
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
