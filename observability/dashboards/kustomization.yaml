apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: grafana-dashboard-serving-overview
    files:
      - serving-overview.json
  - name: grafana-dashboard-gpu-overview
    files:
      - gpu-overview.json
  - name: grafana-dashboard-gateway-overview
    files:
      - gateway-overview.json
  - name: grafana-dashboard-autoscaling-overview
    files:
      - autoscaling-overview.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
