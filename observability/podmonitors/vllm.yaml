apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vllm
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - llm-serving
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: llama31-8b
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
