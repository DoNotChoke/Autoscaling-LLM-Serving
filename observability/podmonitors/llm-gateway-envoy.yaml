apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: llm-gateway-envoy
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      gateway.envoyproxy.io/owning-gateway-name: llm-gateway
      gateway.envoyproxy.io/owning-gateway-namespace: llm-serving
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
