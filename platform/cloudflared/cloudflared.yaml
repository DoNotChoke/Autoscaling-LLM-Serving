# Cloudflare Quick Tunnel tới gateway: không cần tài khoản/domain. URL https://<random>.trycloudflare.com nằm trong log
# và ĐỔI mỗi khi pod restart. Quick tunnel không hỗ trợ SSE (stream) và không cam kết uptime.
#   kubectl -n cloudflared logs deploy/cloudflared | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels: { app: cloudflared }
spec:
  replicas: 1 # mỗi pod là một quick tunnel với URL riêng
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.2
          args:
            - tunnel
            - --no-autoupdate
            - --metrics=0.0.0.0:2000
            # Chỉ trỏ tới gateway, không bao giờ trỏ thẳng vLLM
            - --url=http://llm-gateway-envoy.envoy-gateway-system.svc.cluster.local:80
          ports:
            - { name: metrics, containerPort: 2000 }
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
