# Chart loki 20.0.1
backend:
  replicas: 0
chunksCache:
  enabled: false
compactor:
  replicas: 0
deploymentMode: Monolithic
distributor:
  replicas: 0
gateway:
  enabled: false
indexGateway:
  replicas: 0
ingester:
  replicas: 0
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    delete_request_store: filesystem
    retention_enabled: true
    working_directory: /var/loki/compactor
  limits_config:
    retention_period: 168h
  schemaConfig:
    configs:
    - from: "2024-04-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
lokiCanary:
  enabled: false
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
read:
  replicas: 0
resultsCache:
  enabled: false
ruler:
  enabled: false
sidecar:
  rules:
    enabled: false
singleBinary:
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClass: local-path
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
test:
  enabled: false
write:
  replicas: 0
