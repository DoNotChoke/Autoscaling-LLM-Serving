# Registry OCI trong cụm cho image model (KServe Modelcars). Một bản trên node-1, các node pull qua NodePort 30500.
# Secret registry-auth (tạo ngoài Git, xem registry-auth-secret.yaml.example): htpasswd + username/password cho client
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels: { app.kubernetes.io/name: registry }
spec:
  replicas: 1
  strategy: { type: Recreate } # PVC RWO
  selector:
    matchLabels: { app.kubernetes.io/name: registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: registry }
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: s12gbn3-system-product-name
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: registry
          image: registry:3.1.2
          env:
            - { name: REGISTRY_AUTH, value: htpasswd }
            - { name: REGISTRY_AUTH_HTPASSWD_REALM, value: llm-registry }
            - { name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          ports:
            - { name: http, containerPort: 5000 }
          # /v2/ trả 401 khi bật auth nên probe bằng TCP
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: auth, mountPath: /auth, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
        - name: auth
          secret:
            secretName: registry-auth
            items: [{ key: htpasswd, path: htpasswd }]
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: registry }
  ports:
    - { name: http, port: 5000, targetPort: http, nodePort: 30500 }
